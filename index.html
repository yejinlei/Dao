<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>道藏本体论 | 全藏原典</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{font-family:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif;background:#f5efe0;color:#2d2416;overflow:hidden;font-size:14px;line-height:1.6;}
/* 顶部导航 */
.top-nav{height:48px;background:#2d2416;display:flex;align-items:center;padding:0 24px;color:#e8d9b8;border-bottom:2px solid #8b6914;}
.top-nav .brand{font-size:18px;font-weight:700;color:#f5d87a;letter-spacing:2px;margin-right:20px;}
.top-nav .brand em{color:#c49a3c;font-style:normal;margin:0 10px;}
.top-nav .nav-tab{padding:8px 14px;color:#e8d9b8;text-decoration:none;font-size:15px;cursor:pointer;border-bottom:2px solid transparent;}
.top-nav .nav-tab:hover{color:#f5d87a;}
.top-nav .nav-tab.active{color:#fff;background:#3d3322;border-bottom:2px solid #d4a84a;}
/* 主体 */
.main{display:flex;height:calc(100vh - 48px);}
/* 左侧栏 */
.sidebar{width:280px;background:#f8f2e2;border-right:1px solid #d4c59a;display:flex;flex-direction:column;flex-shrink:0;}
.sidebar-header{padding:12px 14px 8px;border-bottom:1px solid #e6d9b5;background:#fbf6e6;}
.sidebar-title{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.sidebar-title h3{font-size:15px;color:#2d2416;font-weight:700;}
.sidebar-title .badge-ready{background:#6b8e23;color:#fff;padding:2px 8px;border-radius:3px;font-size:12px;font-family:sans-serif;}
.search-box{width:100%;padding:7px 10px;border:1px solid #c9b88a;border-radius:4px;background:#fffdf5;font-size:13px;color:#2d2416;margin-bottom:8px;font-family:inherit;}
.search-box:focus{outline:none;border-color:#8b6914;}
.filter-label{font-size:11px;color:#8b7a4c;margin-bottom:2px;font-family:sans-serif;}
.filter-select{width:100%;padding:6px 8px;border:1px solid #c9b88a;border-radius:4px;background:#fffdf5;font-size:13px;color:#2d2416;font-family:inherit;margin-bottom:6px;cursor:pointer;}
.filter-select:focus{outline:none;border-color:#8b6914;}
/* 经目列表 */
.sutra-list{flex:1;overflow-y:auto;padding:6px 0;}
.sutra-list::-webkit-scrollbar{width:8px;}
.sutra-list::-webkit-scrollbar-thumb{background:#c9b88a;border-radius:4px;}
.sutra-list::-webkit-scrollbar-track{background:#f5efe0;}
.sutra-group{padding:6px 14px;background:#efe4c3;font-size:12px;color:#5a4a2a;font-weight:700;border-top:1px solid #d4c59a;font-family:sans-serif;letter-spacing:1px;position:sticky;top:0;}
.sutra-item{padding:7px 14px;cursor:pointer;border-bottom:1px dotted #e6d9b5;display:flex;align-items:center;gap:6px;font-size:13px;}
.sutra-item:hover{background:#f0e7c9;}
.sutra-item.active{background:#e8d9b5;border-left:3px solid #8b6914;padding-left:11px;}
.sutra-item .jing-name{flex:1;color:#2d2416;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sutra-item .jing-id{font-family:Consolas,monospace;font-size:11px;color:#8b7a4c;background:#efe4c3;padding:1px 5px;border-radius:2px;flex-shrink:0;}
.sidebar-footer{padding:8px 14px;border-top:1px solid #e6d9b5;background:#fbf6e6;font-size:12px;color:#8b7a4c;font-family:sans-serif;text-align:center;}
/* 右侧主区 */
.content{flex:1;overflow-y:auto;background:#fdfaf0;position:relative;}
.content::-webkit-scrollbar{width:10px;}
.content::-webkit-scrollbar-thumb{background:#c9b88a;border-radius:5px;}
/* 欢迎页 */
.welcome{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;}
.welcome .scroll-icon{font-size:80px;margin-bottom:20px;opacity:.6;}
.welcome h1{font-size:32px;color:#2d2416;margin-bottom:16px;letter-spacing:3px;font-weight:700;}
.welcome .sub{font-size:18px;color:#5a4a2a;margin-bottom:20px;}
.welcome .desc{font-size:15px;color:#8b7a4c;margin-bottom:10px;}
.welcome .stats{font-size:14px;color:#8b7a4c;margin-top:20px;font-family:sans-serif;}
.welcome .stats em{color:#8b3a3a;font-style:normal;font-weight:700;font-size:18px;}
/* 阅读工具栏 */
.reader-toolbar{position:sticky;top:0;background:#fbf6e6;border-bottom:1px solid #d4c59a;padding:10px 24px;display:flex;align-items:center;gap:8px;z-index:10;flex-wrap:wrap;}
.reader-title{font-size:16px;font-weight:700;color:#2d2416;margin-right:auto;padding-left:10px;border-left:3px solid #8b6914;}
.mode-btns{display:flex;border:1px solid #c9b88a;border-radius:4px;overflow:hidden;}
.mode-btn{padding:6px 14px;background:#fffdf5;border:none;cursor:pointer;font-size:13px;color:#5a4a2a;border-right:1px solid #c9b88a;font-family:inherit;}
.mode-btn:last-child{border-right:none;}
.mode-btn:hover{background:#f0e7c9;}
.mode-btn.active{background:#8b6914;color:#fff;font-weight:700;}
.size-btns{display:flex;border:1px solid #c9b88a;border-radius:4px;overflow:hidden;}
.size-btn{padding:6px 10px;background:#fffdf5;border:none;cursor:pointer;font-size:13px;color:#5a4a2a;border-right:1px solid #c9b88a;font-family:sans-serif;}
.size-btn:last-child{border-right:none;}
.size-btn:hover{background:#f0e7c9;}
.size-btn.active{background:#8b6914;color:#fff;}
.tool-btn{padding:6px 10px;background:#fffdf5;border:1px solid #c9b88a;border-radius:4px;cursor:pointer;font-size:14px;color:#5a4a2a;}
.tool-btn:hover{background:#f0e7c9;color:#8b3a3a;}
.close-btn{padding:6px 12px;background:#c74a3d;border:1px solid #a83c31;border-radius:4px;cursor:pointer;font-size:13px;color:#fff;font-family:inherit;}
.close-btn:hover{background:#a83c31;}
/* 正文 */
.reader-body{padding:30px 50px 60px;max-width:980px;margin:0 auto;}
.jing-meta{background:#f0e7c9;border-left:4px solid #6b8e23;padding:14px 20px;margin-bottom:28px;border-radius:0 4px 4px 0;}
.jing-meta .jname{font-size:22px;color:#2d2416;font-weight:700;margin-bottom:6px;letter-spacing:2px;}
.jing-meta .jinfo{font-size:13px;color:#6b5838;font-family:sans-serif;}
.jing-meta .jinfo .tag{background:#8b6914;color:#fff;padding:1px 7px;border-radius:3px;font-size:11px;margin-right:6px;}
.verse-block{margin-bottom:18px;}
.verse-block .orig{font-size:17px;line-height:2;color:#2d2416;text-indent:2em;}
.verse-block .orig ruby{ruby-align:center;}
.verse-block .orig rt{font-size:11px;color:#8b7a4c;font-family:sans-serif;}
.duan-title{font-size:18px;color:#8b3a3a;font-weight:700;margin:28px 0 14px;padding-left:12px;border-left:4px solid #8b3a3a;letter-spacing:2px;}
.loading{text-align:center;padding:60px;color:#8b7a4c;font-size:16px;}
.error-msg{text-align:center;padding:60px;color:#c74a3d;}
.plain-text{font-size:17px;line-height:2.2;color:#2d2416;white-space:pre-wrap;}
</style>
</head>
<body>

<div class="top-nav">
  <span class="brand">道藏本体论<em>|</em><span style="background:#fff;color:#2d2416;padding:2px 10px;font-size:15px;">全藏原典</span></span>
  <div style="margin-left:auto;">
    <a class="nav-tab" href="#home">首页</a>
    <a class="nav-tab" href="#classes">部类总览</a>
    <a class="nav-tab active" href="#sutras">全藏原典</a>
    <a class="nav-tab" href="#search">全文检索</a>
    <a class="nav-tab" href="#dict">道教词典</a>
    <a class="nav-tab" href="#graph">义理图谱</a>
    <a class="nav-tab" href="#sect">判教对比</a>
    <a class="nav-tab" href="#deduce">概念推演</a>
  </div>
</div>

<div class="main">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">
        <span style="font-size:18px;">📖</span>
        <h3>正统道藏经目</h3>
        <span class="badge-ready">已就绪</span>
      </div>
      <input type="text" class="search-box" id="searchInput" placeholder="搜经名…">
      <div><div class="filter-label">按部类</div><select class="filter-select" id="filterBu"><option value="">全部部类</option></select></div>
      <div><div class="filter-label">按子类</div><select class="filter-select" id="filterSub"><option value="">全部子类</option></select></div>
    </div>
    <div class="sutra-list" id="sutraList"></div>
    <div class="sidebar-footer" id="sidebarFooter">共 0 部经</div>
  </aside>

  <main class="content" id="contentArea">
    <div class="welcome">
      <div class="scroll-icon">📜</div>
      <h1>正统道藏全文在线阅读</h1>
      <p class="sub">从左侧选择一部经典开始阅读。</p>
      <p class="desc" id="welcomeStats">正在加载经目…</p>
      <p class="desc">数据来自《正统道藏》《万历续道藏》及藏外道书，按经独立加载，秒开阅读。</p>
      <p class="stats">首批上线 <em id="totalCount">104</em> 部常诵短篇道经，三洞四辅全藏1721部陆续补传中。</p>
    </div>
  </main>
</div>

<script>
let SUTRAS=[], BU_LIST=[], currentSutra=null, currentMode='orig', currentSize=17;
const $=id=>document.getElementById(id);
const contentArea=$('contentArea');

fetch('sutras.json?_='+Date.now())
  .then(r=>r.json())
  .then(d=>{SUTRAS=d.sutras;BU_LIST=d.buList;$('totalCount').textContent=d.total;$('welcomeStats').textContent='首批收录'+d.total+'部常诵短篇道经（核心经典先行），全藏1721部陆续补传。';initFilters();renderList(SUTRAS);})
  .catch(e=>{$('welcomeStats').textContent='经目加载失败：'+e.message;});

function initFilters(){
  const bu=$('filterBu'),sub=$('filterSub');
  BU_LIST.forEach(b=>{const o=document.createElement('option');o.value=b.code;o.textContent=b.name;bu.appendChild(o);});
  const subs=new Set();SUTRAS.forEach(s=>{if(s.sub)subs.add(s.sub);});
  [...subs].sort().forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;sub.appendChild(o);});
  $('searchInput').addEventListener('input',applyFilter);
  bu.addEventListener('change',applyFilter);sub.addEventListener('change',applyFilter);
}
function applyFilter(){
  const kw=$('searchInput').value.trim(),b=$('filterBu').value,sub=$('filterSub').value;
  renderList(SUTRAS.filter(s=>(!kw||s.name.includes(kw))&&(!b||s.buCode===b)&&(!sub||s.sub===sub)));
}
function renderList(list){
  const el=$('sutraList');el.innerHTML='';
  if(!list.length){el.innerHTML='<div style="padding:20px;text-align:center;color:#8b7a4c;font-size:13px;">无匹配结果</div>';$('sidebarFooter').textContent='共 0 部经';return;}
  const groups={};list.forEach(s=>{const g=s.bu;if(!groups[g])groups[g]=[];groups[g].push(s);});
  Object.keys(groups).forEach(g=>{
    const gh=document.createElement('div');gh.className='sutra-group';gh.textContent=g+'（'+groups[g].length+'）';el.appendChild(gh);
    groups[g].forEach(s=>{
      const it=document.createElement('div');it.className='sutra-item';it.dataset.id=s.id;
      it.innerHTML=`<span class="jing-name">${s.name}</span><span class="jing-id">${s.id}</span>`;
      it.addEventListener('click',()=>openSutra(s,it));el.appendChild(it);
    });
  });
  $('sidebarFooter').textContent='共 '+list.length+' 部经';
}
function openSutra(s,itemEl){
  document.querySelectorAll('.sutra-item.active').forEach(x=>x.classList.remove('active'));
  if(itemEl)itemEl.classList.add('active');
  currentSutra=s;currentMode='orig';
  renderShell(s);loadContent(s);
}
function renderShell(s){
  const sb=[14,17,20,24].map((sz,i)=>`<button class="size-btn${sz===currentSize?' active':''}" data-sz="${sz}">${['A-','A','A+','A++'][i]}</button>`).join('');
  contentArea.innerHTML=`
    <div class="reader-toolbar">
      <div class="reader-title">${s.name}</div>
      <div class="mode-btns">
        <button class="mode-btn active" data-m="orig">📜 原文</button>
        <button class="mode-btn" data-m="pinyin">🔤 注音</button>
        <button class="mode-btn" style="opacity:.5;cursor:not-allowed;" title="白话翻译逐步精校补充中">📖 对照(待)</button>
        <button class="mode-btn" style="opacity:.5;cursor:not-allowed;" title="白话翻译逐步精校补充中">📝 白话(待)</button>
      </div>
      <div class="size-btns">${sb}</div>
      <button class="tool-btn" title="收藏">⭐</button>
      <button class="tool-btn" title="笔记">📝</button>
      <button class="tool-btn" title="书签">🔖</button>
      <button class="close-btn" id="closeReader">✕ 关闭</button>
    </div>
    <div class="reader-body" id="readerBody"><div class="loading">正在加载经文…</div></div>`;
  contentArea.querySelectorAll('.mode-btn[data-m]').forEach(b=>b.addEventListener('click',()=>{
    if(!b.dataset.m)return;currentMode=b.dataset.m;
    contentArea.querySelectorAll('.mode-btn[data-m]').forEach(x=>x.classList.remove('active'));b.classList.add('active');loadContent(currentSutra);
  }));
  contentArea.querySelectorAll('.size-btn').forEach(b=>b.addEventListener('click',()=>{
    currentSize=+b.dataset.sz;contentArea.querySelectorAll('.size-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');
    const bd=$('readerBody');if(bd)bd.style.fontSize=currentSize+'px';
  }));
  $('closeReader').addEventListener('click',closeReader);
  contentArea.scrollTop=0;
}
function closeReader(){
  currentSutra=null;document.querySelectorAll('.sutra-item.active').forEach(x=>x.classList.remove('active'));
  contentArea.innerHTML=`<div class="welcome"><div class="scroll-icon">📜</div><h1>正统道藏全文在线阅读</h1><p class="sub">从左侧选择一部经典开始阅读。</p><p class="desc">首批上线${SUTRAS.length}部常诵短篇道经，三洞四辅全藏1721部陆续补传中。</p><p class="desc">数据来自《正统道藏》《万历续道藏》及藏外道书，按经独立加载，秒开阅读。</p></div>`;
}
async function loadContent(s){
  const bd=$('readerBody');if(!bd)return;
  bd.innerHTML='<div class="loading">正在加载经文…</div>';bd.style.fontSize=currentSize+'px';
  try{
    const r=await fetch(s.file);if(!r.ok)throw new Error('加载失败 '+r.status);
    const t=await r.text();render(s,t);
  }catch(e){bd.innerHTML=`<div class="error-msg">加载失败：${e.message}</div>`;}
}
function render(s,text){
  const bd=$('readerBody');
  let h=`<div class="jing-meta"><div class="jname">${s.name}</div><div class="jinfo"><span class="tag">${s.buCode}</span>${s.bu} · ${s.sub} · 经号 ${s.id}</div></div>`;
  const paras=text.split(/\n+/).map(p=>p.trim()).filter(Boolean);
  paras.forEach(p=>{
    if(/^(卷[上中下一二三四五六七八九十百0-9]+|第[一二三四五六七八九十百0-9]+[章节品卷]|序|跋|附录|题解|#)/.test(p)||(p.length<15&&!/[。，；]$/.test(p))){
      h+=`<div class="duan-title">${p}</div>`;
    }else{
      const t=currentMode==='pinyin'?addPinyin(p):p;
      h+=`<div class="verse-block"><div class="orig">${t}</div></div>`;
    }
  });
  bd.innerHTML=h;
}
const P={'炁':'qì','箓':'lù','齋':'zhāi','醮':'jiào','禳':'ráng','罡':'gāng','坎':'kǎn','離':'lí','乾':'qián','坤':'kūn','艮':'gèn','巽':'xùn','震':'zhèn','兌':'duì','闔':'hé','闢':'pì','爐':'lú','鼎':'dǐng','鉛':'qiān','汞':'gǒng','龜':'guī','鶴':'hè','龍':'lóng','嬰':'yīng','姹':'chà','旛':'fān','靈':'líng','寶':'bǎo','經':'jīng','籙':'lù','呪':'zhòu','訣':'jué','諱':'huì','煞':'shà','敕':'chì','攝':'shè','孽':'niè','魑':'chī','魅':'mèi','魍':'wǎng','魎':'liǎng','魃':'bá','魘':'yǎn','臟':'zàng','腑':'fǔ','竅':'qiào','腎':'shèn','氣':'qì','魂':'hún','魄':'pò','尸':'shī','蟲':'chóng','壇':'tán','墳':'fén','塚':'zhǒng','鬱':'yù','闕':'què','穢':'huì','灑':'sǎ','凈':'jìng','禮':'lǐ','懺':'chàn','誦':'sòng','禱':'dǎo','隱':'yǐn','顯':'xiǎn','彌':'mí','無':'wú','為':'wéi','爾':'ěr','來':'lái','淵':'yuān','樞':'shū','璣':'jī','璇':'xuán','衡':'héng','躡':'niè','躍':'yuè','履':'lǚ','馭':'yù'};
function addPinyin(t){let o='';for(const c of t){if(P[c])o+=`<ruby>${c}<rt>${P[c]}</rt></ruby>`;else o+=c;}return o;}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&currentSutra)closeReader();});
</script>
</body>
</html>
